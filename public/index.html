<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WebUNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="toasts"></div>

<!-- ══ HOME ══ -->
<div id="s-home" class="screen active">
  <div class="scanlines"></div>
  <h1 class="logo">UNO</h1>
  <p class="sub">dark realm · 2–6 players</p>
  <div class="stack">
    <button class="btn primary" id="btn-create">[ CREATE ROOM ]</button>
    <button class="btn ghost"   id="btn-join-home">[ JOIN ROOM ]</button>
  </div>
</div>

<!-- ══ CREATE ══ -->
<div id="s-create" class="screen">
  <h2>CREATE ROOM</h2>
  <label>YOUR NAME
    <input id="create-name" type="text" maxlength="20" placeholder="enter name..." autocomplete="off" />
  </label>
  <div class="row gap">
    <button class="btn ghost sm" id="btn-create-back">← BACK</button>
    <button class="btn primary"  id="btn-create-confirm">CREATE →</button>
  </div>
</div>

<!-- ══ JOIN ══ -->
<div id="s-join" class="screen">
  <h2>JOIN ROOM</h2>
  <label>YOUR NAME
    <input id="join-name" type="text" maxlength="20" placeholder="enter name..." autocomplete="off" />
  </label>
  <label>ROOM CODE
    <input id="join-code" type="text" maxlength="6" placeholder="XXXXXX" autocomplete="off" />
  </label>
  <div class="row gap">
    <button class="btn ghost sm" id="btn-join-back">← BACK</button>
    <button class="btn primary"  id="btn-join-confirm">JOIN →</button>
  </div>
</div>

<!-- ══ LOBBY ══ -->
<div id="s-lobby" class="screen">
  <div class="lobby-layout">

    <div class="lobby-left">
      <div class="row sb" style="margin-bottom:16px">
        <h2 style="margin:0">LOBBY</h2>
        <div class="code-chip">
          <span id="lcode"></span>
          <button class="icon-btn" id="btn-copy-code" title="Copy code">⧉</button>
        </div>
      </div>
      <div id="lobby-players" class="player-list"></div>
      <div id="host-section" style="display:none">
        <p class="hint" id="lobby-hint"></p>
        <button class="btn primary" id="btn-start" disabled>[ START GAME ]</button>
      </div>
      <div id="guest-section" style="display:none">
        <p class="hint">waiting for host to start...</p>
      </div>
      <button class="btn ghost sm" id="btn-leave-lobby" style="margin-top:12px;align-self:flex-start">← LEAVE</button>
    </div>

    <div class="lobby-right">
      <p class="label">INVITE</p>
      <div class="qr-wrap"><img id="qr-img" src="" alt="QR Code" /></div>
      <div class="invite-row">
        <input id="invite-link" type="text" readonly />
        <button class="btn sm" id="btn-copy-link">COPY</button>
      </div>
      <p class="hint center">scan QR · share link · enter code</p>
    </div>

  </div>
</div>

<!-- ══ GAME ══ -->
<div id="s-game" class="screen">
  <div class="scanlines-subtle"></div>

  <!-- Top: opponents + leave -->
  <div id="top-bar">
    <div id="opp-area"></div>
    <button class="btn-x" id="btn-leave-game" title="Leave game">✕</button>
  </div>

  <!-- Table -->
  <div class="table">
    <div class="piles">
      <div class="draw-pile-wrap">
        <div class="draw-pile" id="draw-pile">
          <img src="/cards/card_000.png" alt="draw pile" draggable="false" />
        </div>
        <span id="draw-badge" class="draw-badge" style="display:none"></span>
      </div>
      <div class="pile-wrap" id="discard-wrap"></div>
    </div>
    <div class="status-row">
      <span id="st-dir">↻</span>
      <span id="st-color" class="cdot wild"></span>
      <span id="st-turn"></span>
    </div>
  </div>

  <!-- Actions -->
  <div id="action-row">
    <button class="btn sm ghost" id="btn-pass" style="display:none">PASS</button>
    <button class="btn uno"      id="btn-uno"  style="display:none">UNO!</button>
  </div>

  <!-- Hand -->
  <div id="hand-area">
    <div id="my-hand"></div>
  </div>

  <!-- Color picker modal -->
  <div id="color-picker" class="modal" style="display:none">
    <div class="modal-box">
      <p class="modal-title">CHOOSE COLOR</p>
      <div class="color-grid">
        <button class="cbtn cbtn-r" data-color="red">RED</button>
        <button class="cbtn cbtn-g" data-color="green">GREEN</button>
        <button class="cbtn cbtn-b" data-color="blue">BLUE</button>
        <button class="cbtn cbtn-y" data-color="yellow">YELLOW</button>
      </div>
    </div>
  </div>

  <!-- Leave confirm modal -->
  <div id="leave-confirm" class="modal" style="display:none">
    <div class="modal-box">
      <p class="modal-title">LEAVE GAME?</p>
      <p class="hint" style="margin-top:6px;text-align:center">your hand will be lost</p>
      <div class="row gap" style="margin-top:20px;justify-content:center">
        <button class="btn ghost sm" id="btn-leave-cancel">CANCEL</button>
        <button class="btn danger sm" id="btn-leave-confirm">LEAVE</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ GAME OVER ══ -->
<div id="s-gameover" class="screen">
  <div class="scanlines-subtle"></div>
  <div class="go-box">
    <div class="go-crown">👑</div>
    <div id="go-winner"></div>
    <div id="go-scores"></div>
    <div id="go-host-btn" style="display:none">
      <button class="btn primary" id="btn-play-again">[ PLAY AGAIN ]</button>
    </div>
    <button class="btn ghost" id="btn-go-home">[ LEAVE ]</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
</body>
</html>
