<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080c12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WebUNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="toasts"></div>

<!-- ══ HOME ══ -->
<div id="s-home" class="screen active">
  <div class="home-glow"></div>
  <h1 class="logo">UNO</h1>
  <p class="sub">Dark realms · 2–6 players</p>
  <div class="stack">
    <button class="btn primary" id="btn-create">Create Room</button>
    <button class="btn ghost"   id="btn-join-home">Join Room</button>
  </div>
</div>

<!-- ══ CREATE ══ -->
<div id="s-create" class="screen">
  <h2>Create Room</h2>
  <label>Your name
    <input id="create-name" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off" />
  </label>
  <div class="row gap">
    <button class="btn ghost"   id="btn-create-back">← Back</button>
    <button class="btn primary" id="btn-create-confirm">Create</button>
  </div>
</div>

<!-- ══ JOIN ══ -->
<div id="s-join" class="screen">
  <h2>Join Room</h2>
  <label>Your name
    <input id="join-name" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off" />
  </label>
  <label>Room code
    <input id="join-code" type="text" maxlength="6" placeholder="XXXXXX" autocomplete="off" />
  </label>
  <div class="row gap">
    <button class="btn ghost"   id="btn-join-back">← Back</button>
    <button class="btn primary" id="btn-join-confirm">Join</button>
  </div>
</div>

<!-- ══ LOBBY ══ -->
<div id="s-lobby" class="screen">
  <div class="lobby-layout">

    <div class="lobby-left">
      <div class="row sb" style="margin-bottom:16px">
        <h2 style="margin:0">Lobby</h2>
        <div class="code-chip">
          <span id="lcode"></span>
          <button class="icon-btn" id="btn-copy-code" title="Copy code">⧉</button>
        </div>
      </div>
      <div id="lobby-players" class="player-list"></div>
      <div id="host-section" style="display:none">
        <p class="hint" id="lobby-hint"></p>
        <button class="btn primary" id="btn-start" disabled>Start Game</button>
      </div>
      <div id="guest-section" style="display:none">
        <p class="hint">Waiting for host to start…</p>
      </div>
      <button class="btn ghost sm" id="btn-leave-lobby" style="margin-top:8px;align-self:flex-start">Leave Room</button>
    </div>

    <div class="lobby-right">
      <p class="label">Invite</p>
      <div class="qr-wrap"><img id="qr-img" src="" alt="QR Code" /></div>
      <div class="invite-row">
        <input id="invite-link" type="text" readonly />
        <button class="btn sm" id="btn-copy-link">Copy</button>
      </div>
      <p class="hint center">Scan QR · share link · enter code</p>
    </div>

  </div>
</div>

<!-- ══ GAME ══ -->
<div id="s-game" class="screen">

  <!-- Top bar: opponents + leave -->
  <div id="top-bar">
    <div id="opp-area"></div>
    <button class="btn-leave" id="btn-leave-game" title="Leave game">✕</button>
  </div>

  <!-- Center table -->
  <div class="table">
    <div class="piles">
      <div class="draw-pile" id="draw-pile">
        <span id="draw-label">DRAW</span>
      </div>
      <div class="pile-wrap" id="discard-wrap"></div>
    </div>
    <div class="status-row">
      <span id="st-dir">↻</span>
      <span id="st-color" class="cdot wild"></span>
      <span id="st-turn"></span>
    </div>
  </div>

  <!-- Action row -->
  <div id="action-row">
    <button class="btn sm ghost" id="btn-pass" style="display:none">Pass</button>
    <button class="btn uno"      id="btn-uno"  style="display:none">UNO!</button>
  </div>

  <!-- Hand -->
  <div id="hand-area">
    <div id="my-hand"></div>
  </div>

  <!-- Color picker -->
  <div id="color-picker" class="modal" style="display:none">
    <div class="modal-box">
      <p>Choose a color</p>
      <div class="color-grid">
        <button class="cbtn" data-color="red"    style="background:#c0392b">Red</button>
        <button class="cbtn" data-color="green"  style="background:#1a7a3a">Green</button>
        <button class="cbtn" data-color="blue"   style="background:#1a4fa0">Blue</button>
        <button class="cbtn" data-color="yellow" style="background:#b8860b;color:#fff">Yellow</button>
      </div>
    </div>
  </div>

  <!-- Leave confirm -->
  <div id="leave-confirm" class="modal" style="display:none">
    <div class="modal-box">
      <p>Leave the game?</p>
      <p class="hint" style="margin-top:4px">Your cards will be removed.</p>
      <div class="row gap" style="margin-top:16px;justify-content:center">
        <button class="btn ghost sm" id="btn-leave-cancel">Cancel</button>
        <button class="btn danger sm" id="btn-leave-confirm">Leave</button>
      </div>
    </div>
  </div>

</div>

<!-- ══ GAME OVER ══ -->
<div id="s-gameover" class="screen">
  <div class="go-box">
    <div class="go-trophy">🏆</div>
    <div id="go-winner"></div>
    <div id="go-scores"></div>
    <div id="go-host-btn" style="display:none">
      <button class="btn primary" id="btn-play-again">Play Again</button>
    </div>
    <button class="btn ghost" id="btn-go-home">Leave</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
</body>
</html>
